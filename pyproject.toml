[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-sync"
version = "1.2.0"
description = "Async three-way sync engine for Obsidian vaults between Windows and iCloud Drive"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "colorama>=0.4.6",
    "aiofiles>=23.2.1",
    "pyyaml>=6.0",
    "watchdog>=4.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[project.scripts]
obsidian-sync = "obsidian_sync.__main__:main"

[project.optional-dependencies]
tray = ["pystray>=0.19.5", "Pillow>=10.0"]

[tool.setuptools.packages.find]
include = ["obsidian_sync*"]
