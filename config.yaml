# Obsidian iCloud Windows Sync - Configuration
# Copy this file and adjust paths for your setup.

paths:
  local_vault: "C:\\Obsidian\\Vault"
  icloud_vault: "C:\\Users\\user\\iCloudDrive\\iCloud~md~obsidian"
  history_dir: "C:\\Obsidian\\History"
  logs_dir: "C:\\Obsidian\\Logs"

sync:
  run_continuously: true
  check_icloud_status: true
  poll_interval: 2
  stability_window: 3
  stabilize_wait: 8
  tiny_threshold: 8
  # Seconds a file must stay unchanged (both vaults) before it is synced. Prevents
  # editor autosaves from being pushed one by one, which makes iCloud fork
  # conflict copies. 0 disables. quiet_max_wait caps the wait for files that never settle.
  quiet_period: 20
  quiet_max_wait: 600

logging:
  console_level: "normal"      # quiet | normal | verbose
  shorter_paths: true
  max_display_length: 50
  log_retention: 10

ignore:
  patterns: []
  # Examples:
  #   - ".obsidian/plugins"
  #   - ".obsidian/themes"
  #   - "*.canvas"
  #   - "Templates/*"
  dirs:
    - ".trash"
    - ".fseventsd"
    - ".spotlight-v100"
    - ".apdisk"
  files:
    - ".ds_store"
    - ".trash"
    - "workspace.json"
    - "workspace-mobile.json"
